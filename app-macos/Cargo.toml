[package]
name = "app-macos"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
core = { path = "../core" }
spi = { path = "../spi" }
platform-macos = { path = "../platform-macos" }
eframe = "0.37.0"
tokio = { version = "1", features = ["rt-multi-thread"] }

[package.metadata.packager]
product-name = "Command Center"
identifier = "com.marssmart.commandcenter"
description = "macOS counter-surveillance tool"
formats = ["app", "dmg"]

[package.metadata.packager.macos]
# Ad-hoc signature; no Developer ID is available.
signing-identity = "-"
info-plist-path = "Info.plist"
entitlements = "entitlements.plist"
