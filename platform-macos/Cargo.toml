[package]
name = "platform-macos"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
btleplug = "0.11"
futures = "0.3"
objc2 = "0.6"
objc2-core-bluetooth = "0.3"
objc2-core-location = "0.3"
